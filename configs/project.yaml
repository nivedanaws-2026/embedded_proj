# Project configuration (mirrors src/config.py — keep in sync)
project: AI-Predictive-Smart-Irrigation-Software-System
status: research prototype, SIMULATED data only
python: ">=3.10"

paths:
  raw_data: data/raw
  processed: data/processed
  models: models
  reports: reports
  figures: reports/figures

seeds:
  global: 1000
  model: 1000
  ensemble_member: 4000

data:
  files:
    - farm_clean.csv     # 25,920 rows × 26 cols, farms F01–F09 (3 soils × 3 crops)
    - farm_faulty.csv    # same schema, synthetic sensor faults injected
    - farm_shift.csv     # 5,760 rows, S01–S02, unseen "sand" soil + heat wave (OOD)
  generator_script: scripts/generate_datasets.py
  model_inputs: [soil_moisture_measured, temperature_c, humidity_pct, rainfall_mm, et0_mm, irrigation_mm]
  target: soil_moisture_measured
  leakage_columns: [soil_moisture_true, etc_mm, drainage_mm, runoff_mm, water_stress_ks, sensor_fault_label, sensor_fault_type]

forecast:
  history_h: 24
  horizons_h: [1, 3, 6]
  stride: 1
  batch_size: 128
  epochs: 30
  learning_rate: 0.001
  patience: 6
  hidden_units: 64
  cnn_channels: 32
  dropout: 0.1
  ensemble_size: 5
  split_scheme: time-ordered per farm (train / val / test)

decision:
  eval_horizon_h: 24
  weights: {water: 1.0, stress: 2.0, overwater: 1.5, cost: 0.5, risk: 1.0}
  candidates:
    no_irrigation: {amount_mm: 0, delay_h: 0}
    small:          {amount_mm: 5, delay_h: 0}
    medium:         {amount_mm: 10, delay_h: 0}
    large:          {amount_mm: 18, delay_h: 0}
    delay_6h:       {amount_mm: 10, delay_h: 6}
  high_uncertainty_quantile: 0.80
  min_reliability: 0.6

run:
  experiments: "python experiments/run_experiments.py [--quick | --epochs N]"
  dashboard: "streamlit run app.py"
  api: "uvicorn src.api.main:app --reload"
  tests: "python -m pytest -q"